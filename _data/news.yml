- date: Mar 10, 2026
  headline: "New Research Published in Environmental Science & Technology"
  body: |
    Our new study in Environmental Science & Technology examines atmospheric nitrogen and sulfur deposition using machine learning and interpretability analyses.
  link: "https://pubs.acs.org/doi/10.1021/acs.est.5c17006"

