- date: August 19, 2026
  headline: "New Research Published in Environmental Science & Technology"
  body: |
    Our new study in Environmental Science & Technology reconstructs nearly two decades of cloud condensation nuclei (CCN) variability over the North China Plain and reveals evolving aerosol sources and processes controlling CCN activation.
  link: "https://pubs.acs.org/esthag/article/doi/10.1021/acs.est.6c04501/5276943/Explainable-Machine-Learning-Prediction-of-Long"
  
- date: May 5, 2026
  headline: "New Research Published in Earth System Science Data"
  body: |
    My new study in Earth System Science Data presents a deep-learning-based global NO2 dataset designed to support long-term assessments of air pollution, exposure, and inequality.
  link: "https://essd.copernicus.org/articles/18/2999/2026/"

